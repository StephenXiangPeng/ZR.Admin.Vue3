version: '3.8'

services:
  zr-admin-vue3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zr-admin-vue3
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # 如果需要连接后端API，请确保后端服务在同一网络中
      # 或者修改nginx.conf中的proxy_pass地址
    # 如果需要持久化日志
    volumes:
      - ./logs:/var/log/nginx
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 如果需要后端API服务，可以取消注释下面的配置
  # backend:
  #   image: your-backend-image
  #   container_name: zr-admin-backend
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - NODE_ENV=production
  #   restart: unless-stopped

networks:
  default:
    name: zr-admin-network
